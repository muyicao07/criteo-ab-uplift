[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criteo-ab-uplift"
version = "1.0.0"
description = "Full-data Criteo experiment analysis and uplift portfolio"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
 "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2",
 "duckdb>=1.1,<2", "lightgbm>=4.5,<5", "scikit-uplift==0.5.1", "pyarrow>=16",
 "matplotlib>=3.8,<4", "threadpoolctl>=3.2,<4", "nbformat>=5.10,<6",
 "nbclient>=0.10,<1", "ipykernel>=6,<8", "psutil>=6,<8",
]

[project.scripts]
criteo-project = "criteo_ab_uplift.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
